{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:0 auto">
  <h2>Set a new password</h2>
  <p class="small muted">Resetting revokes every active session for your account.</p>
  <label>Reset token</label>
  <input id="token" placeholder="paste the token from the email"/>
  <label>New password</label>
  <input id="password" type="password" placeholder="min 8 chars, mixed case + digit"
         onkeydown="if(event.key==='Enter')reset()"/>
  <div class="row" style="margin-top:14px">
    <button class="btn" id="btn" onclick="reset()">Reset password</button>
    <a class="btn ghost" href="/ui/login">Back to login</a>
  </div>
  <div id="msg" class="small" style="margin-top:12px"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
const qp = new URLSearchParams(location.search);
if (qp.get('token')) document.getElementById('token').value = qp.get('token');

async function reset() {
  const btn = document.getElementById('btn'), msg = document.getElementById('msg');
  btn.disabled = true;
  try {
    const data = await api('/auth/reset-password', {method:'POST', body:{
      token: document.getElementById('token').value.trim(),
      new_password: document.getElementById('password').value}});
    msg.innerHTML = '<span class="badge ok">' + fmt.esc(data.message) + '</span>';
    setTimeout(() => location.href = '/ui/login', 1200);
  } catch (e) { msg.innerHTML = '<span class="badge bad">' + fmt.esc(e.message) + '</span>'; }
  finally { btn.disabled = false; }
}
</script>
{% endblock %}
